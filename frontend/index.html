<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Rota Mais Rapida - Gama DF</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: sans-serif; }
    #mapa { height: 100vh; }
    #painel {
      position: absolute; top: 10px; left: 50px; z-index: 1000;
      background: white; padding: 12px 16px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3); max-width: 280px;
    }
    #painel p { margin: 4px 0; font-size: 14px; }
    button { margin-top: 6px; padding: 6px 10px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="painel">
    <p><b>Clique 2 pontos no mapa</b></p>
    <p id="instrucao">1. Clique na ORIGEM</p>
    <button id="limpar">Limpar</button>
    <p id="resultado"></p>
  </div>
  <div id="mapa"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
